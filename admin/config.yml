backend:
  name: github
  repo: cogemo-alitisam/site-mosquee
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "contenu"
    label: "Contenu du site"
    files:
      - name: "accueil"
        label: "Textes : accueil, mot de bienvenue, histoire"
        file: "content/about.json"
        fields:
          - { label: "Sous-titre de l'accueil (sous le grand titre)", name: "hero_lede", widget: "text" }
          - { label: "Mot de bienvenue du COGEMO (français)", name: "welcome_fr", widget: "text" }
          - { label: "Mot de bienvenue du COGEMO (arabe)", name: "welcome_ar", widget: "text", required: false }
          - label: "Notre histoire"
            name: "histoire"
            widget: "text"
            hint: "Séparez chaque paragraphe par une ligne vide."

      - name: "annonce"
        label: "Annonce mise en avant"
        file: "content/announcement.json"
        fields:
          - { label: "Étiquette", name: "tag", widget: "string", default: "Annonce" }
          - { label: "Texte de l'annonce", name: "text", widget: "text" }

      - name: "actualites"
        label: "Actualités"
        file: "content/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "Texte court", name: "excerpt", widget: "text" }

      - name: "galerie"
        label: "Galerie photo"
        file: "content/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{category}}"
            fields:
              - { label: "Catégorie", name: "category", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Légende", name: "caption", widget: "string", required: false }

      - name: "organisation"
        label: "Organisation interne (COGEMO)"
        file: "content/organisation.json"
        fields:
          - label: "Membres"
            name: "items"
            widget: "list"
            summary: "{{role}} — {{name}}"
            fields:
              - { label: "Fonction", name: "role", widget: "string" }
              - { label: "Nom", name: "name", widget: "string" }

      - name: "reseaux"
        label: "Réseaux sociaux"
        file: "content/social.json"
        fields:
          - { label: "Chaîne YouTube (URL complète)", name: "youtube", widget: "string", required: false, hint: "Laisser vide pour ne pas afficher le lien" }
          - { label: "Compte TikTok (URL complète)", name: "tiktok", widget: "string", required: false }
          - { label: "Chaîne WhatsApp (URL complète)", name: "whatsapp", widget: "string", required: false }
          - { label: "Canal Telegram (URL complète)", name: "telegram", widget: "string", required: false }

      - name: "youtube"
        label: "Al-I'tisâm TV (chaîne YouTube)"
        file: "content/youtube.json"
        fields:
          - label: "ID de la chaîne YouTube"
            name: "channel_id"
            widget: "string"
            required: false
            hint: "Commence par UC... — voir YouTube Studio > Paramètres > Chaîne > Avancé"
